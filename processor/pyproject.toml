[project]
name = "processor"
version = "0.1.0"
description = "PDF RAG preprocessing pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pika>=1.3",
    "pypdf>=5.0",
    "sentence-transformers>=3.2",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py", "pipeline.py"]
