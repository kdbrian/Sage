scalar:
  enabled: true
  actuatorEnabled: true

management:
  endpoints:
    web:
      exposure:
        include: scalar

spring:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  application:
    name: drag

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/drag_db
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:6644}
    database: ${POSTGRES_DB:drag_db}
    driver-class-name: org.postgresql.Driver


  graphql:
    graphiql:
      path: /graph
      enabled: true
    schema:
      locations: classpath:graphql/
      file-extensions: .graphql,.graphqls,.gqls
      printer:
        enabled: true        # Print SDL on startup
    websocket:
      path: /graphql-ws

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:admin1}
    password: ${RABBITMQ_DEFAULT_PASS:LizTetEcrJik}
    virtual-host: /


gg:
  jte:
    developmentMode: true
    templateSuffix: .kte

files:
  upload:
    dir: ${FILE_UPLOAD_DIR:./uploads}

documents:
  reconcile:
    delay-ms: 14400000

jwt:
  secret: ${JWT_SECRET:change-this-dev-only-secret-key-please-override-in-prod}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

graphql:
  # Unlocks /graphql for schema introspection only (see ApiKeyIntrospectionInterceptor) so
  # GraphiQL's docs panel works without a user login. Not a substitute for real auth.
  api-key: ${GRAPHQL_API_KEY:change-this-dev-only-graphql-explorer-key}

webauthn:
  # rp-id MUST be the effective domain clients connect to (no scheme/port) --
  # it's baked into every credential at creation time, so changing it later
  # invalidates every passkey already registered. "localhost" only works for
  # browsers/emulators hitting localhost directly; set the real domain (and
  # matching origins) before deploying anywhere clients actually reach.
  rp-id: ${WEBAUTHN_RP_ID:localhost}
  rp-name: ${WEBAUTHN_RP_NAME:Drag}
  origins: ${WEBAUTHN_ORIGINS:http://localhost:8080}

server:
  port: 8990
  # Trust X-Forwarded-* from the gateway so redirect/absolute URLs (e.g. the
  # GraphiQL redirect at /graph) use the gateway's public address instead of
  # this container's internal hostname.
  forward-headers-strategy: framework